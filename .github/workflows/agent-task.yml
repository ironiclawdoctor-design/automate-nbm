name: 🤖 Agent Task Runner

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent name (e.g., frontend-developer, backend-architect)'
        required: true
        type: string
      task:
        description: 'Task description'
        required: true
        type: string
      qa_level:
        description: 'Quality level 1-5'
        required: false
        default: '3'
        type: string

permissions:
  issues: write
  contents: read

jobs:
  detect-agent:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (contains(github.event.issue.labels.*.name, 'agent-task'))
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.parse.outputs.agent }}
      department: ${{ steps.parse.outputs.department }}
      orchestrate: ${{ steps.parse.outputs.orchestrate }}
      task_body: ${{ steps.parse.outputs.task_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Agent Request
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          INPUT_AGENT: ${{ github.event.inputs.agent || '' }}
          INPUT_TASK: ${{ github.event.inputs.task || '' }}
        run: |
          # From workflow_dispatch
          if [ -n "$INPUT_AGENT" ]; then
            echo "agent=$INPUT_AGENT" >> $GITHUB_OUTPUT
            echo "department=" >> $GITHUB_OUTPUT
            echo "orchestrate=false" >> $GITHUB_OUTPUT
            echo "task_body=$INPUT_TASK" >> $GITHUB_OUTPUT
            exit 0
          fi

          # From issue labels
          AGENT=$(echo "$ISSUE_LABELS" | grep -oP 'agent:\K[^"]+' | head -1 || true)
          DEPT=$(echo "$ISSUE_LABELS" | grep -oP 'department:\K[^"]+' | head -1 || true)
          ORCH=$(echo "$ISSUE_LABELS" | grep -c 'orchestrate' || true)

          # From issue body
          if [ -z "$AGENT" ]; then
            AGENT=$(echo "$ISSUE_BODY" | grep -oP '\*\*Agent:\*\*\s*\K\S+' | head -1 || true)
          fi
          if [ -z "$DEPT" ]; then
            DEPT=$(echo "$ISSUE_BODY" | grep -oP '\*\*Department:\*\*\s*\K\S+' | head -1 || true)
          fi

          echo "agent=${AGENT:-}" >> $GITHUB_OUTPUT
          echo "department=${DEPT:-}" >> $GITHUB_OUTPUT
          echo "orchestrate=$([ "$ORCH" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "task_body<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  acknowledge:
    needs: detect-agent
    runs-on: ubuntu-latest
    if: github.event.issue
    steps:
      - name: Acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            const agent = '${{ needs.detect-agent.outputs.agent }}';
            const dept = '${{ needs.detect-agent.outputs.department }}';
            const orch = '${{ needs.detect-agent.outputs.orchestrate }}';

            let assignee = '';
            if (orch === 'true') {
              assignee = '🔄 **Orchestrator** (multi-agent pipeline)';
            } else if (agent) {
              assignee = `🤖 **${agent}**`;
            } else if (dept) {
              assignee = `🏢 **${dept}** department`;
            } else {
              assignee = '🤖 **Auto-detect** (analyzing task...)';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## 🤖 Automate — Task Received`,
                '',
                `**Assigned to:** ${assignee}`,
                `**Status:** Processing`,
                `**Time:** ${new Date().toISOString()}`,
                '',
                '---',
                '*I\'ll post results here when complete.*'
              ].join('\n')
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['in-progress']
            });

  dispatch:
    needs: [detect-agent, acknowledge]
    if: always() && needs.detect-agent.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch to Agent
        env:
          AGENT: ${{ needs.detect-agent.outputs.agent }}
          DEPARTMENT: ${{ needs.detect-agent.outputs.department }}
          ORCHESTRATE: ${{ needs.detect-agent.outputs.orchestrate }}
          TASK_BODY: ${{ needs.detect-agent.outputs.task_body }}
          TASK_TITLE: ${{ github.event.issue.title || github.event.inputs.task }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '0' }}
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          AUTOMATE_SSH_KEY: ${{ secrets.AUTOMATE_SSH_KEY }}
        run: |
          chmod +x scripts/agent-dispatch.sh
          bash scripts/agent-dispatch.sh

      - name: Post Results
        if: always() && github.event.issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = '⚠️ No result generated. Check workflow logs.';
            try {
              result = fs.readFileSync('/tmp/agent-result.md', 'utf8');
            } catch (e) {}

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result
            });

            // Update labels
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'in-progress'
              });
            } catch (e) {}

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['completed']
            });
