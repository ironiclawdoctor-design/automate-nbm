name: ⏰ Scheduled Automation

on:
  schedule:
    # Runs every 6 hours — adjust as needed
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Manual task to run'
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  scheduled-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Config
        id: config
        run: |
          if [ -f config/automate.yml ]; then
            echo "config_exists=true" >> $GITHUB_OUTPUT
          else
            echo "config_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Scheduled Tasks
        env:
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          MANUAL_TASK: ${{ github.event.inputs.task }}
        run: |
          echo "🕐 Scheduled run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          if [ -n "$MANUAL_TASK" ]; then
            echo "📝 Manual task: $MANUAL_TASK"
          fi
          
          # Add your scheduled automation logic here
          echo "✅ Scheduled tasks completed"

      - name: Report if needed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ALERT] Scheduled task failed — ${new Date().toISOString()}`,
              body: `⚠️ The scheduled automation workflow failed.\n\nCheck logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['alert', 'task']
            });
